<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Data Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .tab-container { display: flex; background: #333; }
        .tab {
            padding: 14px 20px;
            color: white;
            cursor: pointer;
            text-align: center;
            flex: 1;
            border-right: 1px solid #444;
            font-weight: bold;
            transition: background 0.3s;
        }
        .tab:hover { background: #444; }
        .tab.active { background: #555; }
        iframe { width: 100%; height: 92vh; border: none; display: block; }
    </style>
</head>
<body>
    <div class="tab-container">
        <div class="tab active" onclick="loadMap(0)">Heat Map - Waste by City</div>
        <div class="tab" onclick="loadMap(1)">Map - Waste by Pincode</div>
        <div class="tab" onclick="loadMap(2)">Heat Map - Waste by Coordinates</div>
        <div class="tab" onclick="loadMap(3)">Map - Participation % by City</div>
        <div class="tab" onclick="loadMap(4)">Map - Participation % by Pincode</div>
        <div class="tab" onclick="loadMap(5)">Map - Participation % by Coordinates</div>
    </div>
    <iframe id="mapFrame" src="https://rawcdn.githack.com/pmmeenakshi/Map-based-visualization-of-waste-generation-and-paticipation-data/00e8f40f23244346f4b2d9a3f7e85efeb7bef997/city_waste_map.html"></iframe>

    <script>
        const maps = [
            "https://rawcdn.githack.com/pmmeenakshi/Map-based-visualization-of-waste-generation-and-paticipation-data/00e8f40f23244346f4b2d9a3f7e85efeb7bef997/city_waste_map.html",
            "https://rawcdn.githack.com/pmmeenakshi/Map-based-visualization-of-waste-generation-and-paticipation-data/refs/heads/main/pincode_waste_map.html",
            "https://rawcdn.githack.com/pmmeenakshi/Map-based-visualization-of-waste-generation-and-paticipation-data/refs/heads/main/waste_generation_heatmap_and_markers.html",
            "https://rawcdn.githack.com/pmmeenakshi/Map-based-visualization-of-waste-generation-and-paticipation-data/00e8f40f23244346f4b2d9a3f7e85efeb7bef997/participation_map.html",
            "https://rawcdn.githack.com/pmmeenakshi/Map-based-visualization-of-waste-generation-and-paticipation-data/35076419317afe8492a7c6b0f5f86452290d7981/pincode_participation_heatmap.html",
            "https://rawcdn.githack.com/pmmeenakshi/Map-based-visualization-of-waste-generation-and-paticipation-data/35076419317afe8492a7c6b0f5f86452290d7981/pincode_participation_cordinates.html"
        ];

        function loadMap(index) {
            document.getElementById('mapFrame').src = maps[index];
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab')[index].classList.add('active');
        }
    </script>
</body>
</html>
